# Netlify configuration for DSA Progress Tracker Frontend

[build]
  # Build command
  command = "npm run build"

  # Output directory for Next.js
  publish = ".next"

# Next.js runtime configuration
[build.environment]
  NODE_VERSION = "20"

# Environment variables (set these in Netlify UI)
# NEXT_PUBLIC_API_BASE_URL = "your-backend-api-url"

# Redirect rules for API proxy (optional - configure backend URL)
[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/api/:splat"
  status = 200
  force = false

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
